<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Birthday Countdown</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="card">
        <h1 id="title">Birthday Countdown</h1>
        <p id="message" class="message" aria-live="polite"></p>

        <div id="units" class="units" role="timer" aria-label="Time until birthday">
            <div class="unit"><span id="days">0</span><small>Days</small></div>
            <div class="unit"><span id="hours">00</span><small>Hours</small></div>
            <div class="unit"><span id="minutes">00</span><small>Minutes</small></div>
            <div class="unit"><span id="seconds">00</span><small>Seconds</small></div>
        </div>

        <form id="settings" class="settings">
            <label>Name
                <input id="name" type="text" maxlength="40" placeholder="Chris">
            </label>
            <label>Birthday
                <input id="date" type="date" required>
            </label>
            <button type="submit">Save</button>
        </form>
        <p class="hint">Tip: share a link like <code>?name=Chris&amp;date=1990-06-04</code></p>
    </main>

    <script src="app.js"></script>
</body>

</html>
